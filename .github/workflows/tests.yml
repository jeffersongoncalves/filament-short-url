name: Tests

# NOTE: until jeffersongoncalves/laravel-short-url has a tagged release on
# Packagist, this workflow will fail in CI because composer.json points at a
# local path repository (../../laravel/laravel-short-url) that only exists in
# the monorepo dev environment. Switch the "jeffersongoncalves/laravel-short-url"
# constraint to a real version and drop the "repositories" block once
# laravel-short-url is published.

on:
  push:
    branches:
      - 1.x
  pull_request:
    branches:
      - 1.x

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: [8.3, 8.4]
        # NOTE: not [8.1, 8.2, 8.3] — jeffersongoncalves/laravel-short-url v1.3.0
        # (the only tagged release, required by this plugin's composer.json)
        # itself requires php ^8.3, so 8.1/8.2 cannot install regardless of
        # Filament v3's own (lower) php ^8.1 floor.
        stability: [prefer-stable]

    name: PHP ${{ matrix.php }} - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Run Pint
        run: vendor/bin/pint --test

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse

      - name: Run Tests
        run: vendor/bin/pest
